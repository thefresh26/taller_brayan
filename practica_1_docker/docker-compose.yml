# Equivalente al "docker run" de la práctica 1 (mismos puertos y volumen).
# Uso:  docker compose up -d      |      docker compose down
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
